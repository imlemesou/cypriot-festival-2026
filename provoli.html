<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Πρόγραμμα Φεστιβάλ Κυπριακής Παράδοσης</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#222}
body{background:#f3f4f6 url("background.png") center top/cover fixed no-repeat;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(255,255,255,.94);border-bottom:1px solid #ddd}
.heading{font-size:14px;line-height:1.25;font-weight:700}.subheading{font-size:12px;font-weight:400;color:#666;margin-top:2px}
a.home{flex:0 0 auto;text-decoration:none;color:#222;background:#f1f1f1;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600}
.toolbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;padding:8px;background:rgba(255,255,255,.94);border-bottom:1px solid #ddd}
button{padding:7px 11px;min-height:36px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#222;font:inherit;font-size:13px;cursor:pointer}
button[aria-pressed="true"]{background:#222;color:#fff;border-color:#222}
#viewer{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:transparent}
#status{padding:8px;text-align:center;font-size:13px;color:#a01818;background:rgba(255,255,255,.9)}
#status:empty{display:none}
@media(max-width:600px){.heading{font-size:13px}.subheading{font-size:11px}header{padding:7px 9px}.toolbar{gap:5px;padding:7px 4px}button{font-size:12px;padding:6px 8px;min-height:34px}}
</style>
</head>
<body>
<header>
  <div class="heading">Φεστιβάλ Κυπριακής Παράδοσης<div class="subheading" id="dayLabel">Πρόγραμμα εκδήλωσης</div></div>
  <a class="home" href="index.html">Αρχική</a>
</header>
<nav class="toolbar" aria-label="Επιλογή ημέρας">
  <button id="sat" type="button" aria-pressed="false">Σάββατο 24/10</button>
  <button id="sun" type="button" aria-pressed="false">Κυριακή 25/10</button>
</nav>
<div id="status" role="status" aria-live="polite"></div>
<iframe id="viewer" title="Πρόγραμμα Φεστιβάλ Κυπριακής Παράδοσης" allow="fullscreen"></iframe>
<script>
const pdfs={
 saturday:"Σάββατο 24.10.2026.pdf",
 sunday:"Κυριακή 25.10.2026.pdf"
};
const labels={
 saturday:"Σάββατο 24 Οκτωβρίου 2026",
 sunday:"Κυριακή 25 Οκτωβρίου 2026"
};
const frame=document.getElementById("viewer");
const status=document.getElementById("status");
function showProgram(day){
 const file=pdfs[day];
 if(!file)return;
 document.getElementById("sat").setAttribute("aria-pressed",String(day==="saturday"));
 document.getElementById("sun").setAttribute("aria-pressed",String(day==="sunday"));
 document.getElementById("dayLabel").textContent=labels[day];
 status.textContent="";
 // Browser's built-in PDF viewer handles text selection and zoom.
 frame.src=encodeURI(file);
}
frame.addEventListener("error",()=>{status.textContent="Δεν ήταν δυνατή η φόρτωση του PDF. Έλεγξε ότι το αρχείο βρίσκεται στον ίδιο φάκελο με το provoli.html.";});
document.getElementById("sat").addEventListener("click",()=>showProgram("saturday"));
document.getElementById("sun").addEventListener("click",()=>showProgram("sunday"));
const day=new URLSearchParams(location.search).get("day");
showProgram(day==="sunday"?"sunday":"saturday");
</script>
</body>
</html>
