
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efdf">

  <title>Προγράμματα Φεστιβάλ Κυπριακής Παράδοσης</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf_viewer.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6efdf;
      color: #302719;
    }

    /* Μικρότερη κεφαλίδα */
    header {
      padding: 8px 10px;
      text-align: center;
    }

    h1 {
      font-size: clamp(17px, 4vw, 22px);
      line-height: 1.2;
      margin: 0 0 3px;
    }

    #subtitle {
      font-size: 13px;
      margin: 0 0 8px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .buttons a {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 7px;
      background: #45553a;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .buttons a.active {
      background: #8b5e35;
    }

    #status {
      text-align: center;
      padding: 12px;
      font-size: 14px;
    }

    #document {
      width: 100%;
      padding: 0 5px 16px;
    }

    .pdf-page {
      position: relative;
      margin: 0 auto 10px;
      background: white;
      box-shadow: 0 1px 5px #0002;
      overflow: hidden;
    }


.page {
  position: relative;
}

.page canvas {
  display: block;
  position: relative;
  z-index: 1;
}

.textLayer {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  line-height: 1;
  text-align: initial;
  transform-origin: 0 0;
  user-select: text;
  -webkit-user-select: text;
  -webkit-touch-callout: default;
  cursor: text;
}

.textLayer span,
.textLayer br {
  position: absolute;
  color: transparent;
  white-space: pre;
  cursor: text;
  transform-origin: 0 0;
}

.textLayer ::selection {
  background: rgba(0, 100, 255, 0.3);
}
  </style>
</head>

<body>
  <header>
    <h1 id="title">Πρόγραμμα Σαββάτου</h1>
    <p id="subtitle">24 Οκτωβρίου 2026</p>

    <nav class="buttons" aria-label="Επιλογή προγράμματος">
      <a id="sat" href="?day=saturday">Σάββατο</a>
      <a id="sun" href="?day=sunday">Κυριακή</a>
      <a id="sun" href="index.html">Αρχική</a>
    </nav>
  </header>

  <p id="status" role="status">Φόρτωση προγράμματος…</p>
  <main id="document"></main>

  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const programs = {
      saturday: {
        title: "Πρόγραμμα Σαββάτου",
        subtitle: "24 Οκτωβρίου 2026",
        file: "Σάββατο 24.10.2026.pdf"
      },
      sunday: {
        title: "Πρόγραμμα Κυριακής",
        subtitle: "25 Οκτωβρίου 2026",
        file: "Κυριακή 25.10.2026.pdf"
      }
    };

    const params = new URLSearchParams(location.search);
    const day = params.get("day") === "sunday"
      ? "sunday"
      : "saturday";

    const program = programs[day];
    const container = document.getElementById("document");
    const status = document.getElementById("status");

    document.getElementById("title").textContent = program.title;
    document.getElementById("subtitle").textContent = program.subtitle;
    document.title = program.title;

    document.getElementById(day === "saturday" ? "sat" : "sun")
      .classList.add("active");

    async function renderPDF() {
      try {
        const pdfURL = new URL(
          program.file,
          window.location.href
        ).href;

        const pdf = await pdfjsLib.getDocument(pdfURL).promise;
        status.textContent = "";

        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);
          const baseViewport = page.getViewport({ scale: 1 });

          const availableWidth = Math.max(
            250,
            container.clientWidth - 10
          );

          const scale = availableWidth / baseViewport.width;
          const viewport = page.getViewport({ scale });

          const pageDiv = document.createElement("section");
          pageDiv.className = "pdf-page";
          pageDiv.style.width = `${viewport.width}px`;
          pageDiv.style.height = `${viewport.height}px`;

          const canvas = document.createElement("canvas");
          canvas.width = Math.floor(viewport.width * pixelRatio);
          canvas.height = Math.floor(viewport.height * pixelRatio);
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;

          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);

          const context = canvas.getContext("2d");

          await page.render({
            canvasContext: context,
            viewport,
            transform: pixelRatio === 1
              ? null
              : [pixelRatio, 0, 0, pixelRatio, 0, 0]
          }).promise;

          const textLayerDiv = document.createElement("div");
          textLayerDiv.className = "textLayer";
          textLayerDiv.style.width = `${viewport.width}px`;
          textLayerDiv.style.height = `${viewport.height}px`;
          pageDiv.appendChild(textLayerDiv);

          const textContent = await page.getTextContent();

          const textLayer = new pdfjsLib.TextLayer({
            textContentSource: textContent,
            container: textLayerDiv,
            viewport
          });

          await textLayer.render();
        }
      } catch (error) {
        console.error("PDF.js error:", error);
        status.textContent =
          "Δεν ήταν δυνατή η εμφάνιση του προγράμματος. " +
          "Έλεγξε τη σύνδεση στο διαδίκτυο και τα ονόματα των αρχείων PDF.";
      }
    }

    renderPDF();
  </script>
</body>
</html>
