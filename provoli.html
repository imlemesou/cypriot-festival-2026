<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff">
<title>Πρόγραμμα Φεστιβάλ Κυπριακής Παράδοσης</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6 url('background.png') center top / cover fixed no-repeat;color:#222;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;background:rgba(255,255,255,.94);border-bottom:1px solid #e5e5e5}
.heading{font-size:14px;line-height:1.25;font-weight:700}.subheading{margin-top:2px;color:#666;font-size:12px;font-weight:400}
.home{padding:8px 11px;background:#f1f1f1;border-radius:8px;color:#222;text-decoration:none;font-size:13px;font-weight:600}
.toolbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:10px;background:rgba(255,255,255,.94);border-bottom:1px solid #e5e5e5}
button{min-height:38px;padding:8px 12px;border:1px solid #d4d4d4;border-radius:8px;background:#fff;color:#222;font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation}
button[aria-pressed="true"]{background:#222;border-color:#222;color:#fff}
#status{max-width:900px;margin:12px auto;padding:0 14px;color:#555;text-align:center;font-size:14px}
#status.error{color:#a01818;white-space:pre-wrap}
#viewerContainer{width:100%;height:calc(100dvh - 112px);min-height:55vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#viewer{padding:14px 0 30px}
.pdfViewer .page{margin:0 auto 14px;border:1px solid #ddd;box-shadow:0 2px 8px #00000017;background:#fff}
.pdfViewer .textLayer{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
.pdfViewer .textLayer ::selection{background:rgba(45,110,220,.35)}
@media(max-width:600px){header{padding:8px 10px}.heading{font-size:13px}.subheading{font-size:11px}.home{padding:7px 9px;font-size:12px}.toolbar{gap:6px;padding:8px 6px}button{min-height:36px;padding:7px 9px;font-size:13px}#viewerContainer{height:calc(100dvh - 126px)}#viewer{padding-top:8px}.pdfViewer .page{margin-bottom:9px}}
</style>
</head>
<body>
<header><div class="heading">Φεστιβάλ Κυπριακής Παράδοσης<div class="subheading" id="currentDay">Πρόγραμμα εκδήλωσης</div></div><a class="home" href="index.html">Αρχική</a></header>
<nav class="toolbar" aria-label="Επιλογή προγράμματος και μεγέθυνση">
<button id="satButton" type="button" aria-pressed="false">Σάββατο 24/10</button>
<button id="sunButton" type="button" aria-pressed="false">Κυριακή 25/10</button>
<button id="zoomOut" type="button" aria-label="Σμίκρυνση">−</button>
<button id="zoomIn" type="button" aria-label="Μεγέθυνση">+</button>
<button id="fitButton" type="button">Προσαρμογή</button>
</nav>
<div id="status" role="status" aria-live="polite">Φόρτωση προγράμματος…</div>
<main id="viewerContainer" tabindex="0" aria-label="Πρόγραμμα PDF"><div id="viewer" class="pdfViewer"></div></main>
<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";
import { EventBus, PDFViewer, PDFLinkService } from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

const files = {
  saturday: "Σάββατο 24.10.2026.pdf",
  sunday: "Κυριακή 25.10.2026.pdf"
};
const labels = {
  saturday: "Σάββατο 24 Οκτωβρίου 2026",
  sunday: "Κυριακή 25 Οκτωβρίου 2026"
};
const container = document.getElementById("viewerContainer");
const viewerElement = document.getElementById("viewer");
const statusElement = document.getElementById("status");
const dayElement = document.getElementById("currentDay");
const satButton = document.getElementById("satButton");
const sunButton = document.getElementById("sunButton");
const eventBus = new EventBus();
const linkService = new PDFLinkService({ eventBus });
const viewer = new PDFViewer({
  container, viewer: viewerElement, eventBus, linkService,
  textLayerMode: 2, removePageBorders: false
});
linkService.setViewer(viewer);
let currentTask = null;
let currentKey = null;

function setStatus(message, error = false) {
  statusElement.textContent = message;
  statusElement.classList.toggle("error", error);
  statusElement.hidden = !message;
}
function setSelectedButton(key) {
  satButton.setAttribute("aria-pressed", String(key === "saturday"));
  sunButton.setAttribute("aria-pressed", String(key === "sunday"));
  dayElement.textContent = labels[key];
}
function pdfUrl(filename) {
  return new URL(encodeURIComponent(filename), window.location.href).href;
}
async function loadProgram(key) {
  if (!files[key]) return;
  currentKey = key;
  setSelectedButton(key);
  setStatus("Φόρτωση προγράμματος…");
  viewer.setDocument(null);
  linkService.setDocument(null);
  if (currentTask) {
    try { await currentTask.destroy(); } catch (_) {}
    currentTask = null;
  }
  try {
    const task = pdfjsLib.getDocument({ url: pdfUrl(files[key]) });
    currentTask = task;
    const pdf = await task.promise;
    if (currentTask !== task || currentKey !== key) {
      await pdf.destroy();
      return;
    }
    viewer.setDocument(pdf);
    linkService.setDocument(pdf);
    viewer.currentScale = "page-width";
    setStatus("");
  } catch (error) {
    console.error("Σφάλμα φόρτωσης PDF:", error);
    setStatus("Δεν ήταν δυνατή η εμφάνιση του προγράμματος.\nΛεπτομέρεια: " +
      (error?.message || String(error)), true);
  }
}
satButton.addEventListener("click", () => loadProgram("saturday"));
sunButton.addEventListener("click", () => loadProgram("sunday"));
document.getElementById("zoomIn").addEventListener("click", () => {
  if (typeof viewer.currentScale === "number") viewer.currentScale *= 1.15;
  else viewer.currentScale = 1.15;
});
document.getElementById("zoomOut").addEventListener("click", () => {
  if (typeof viewer.currentScale === "number") viewer.currentScale = Math.max(.5, viewer.currentScale / 1.15);
});
document.getElementById("fitButton").addEventListener("click", () => {
  viewer.currentScale = "page-width";
});
const day = new URLSearchParams(window.location.search).get("day");
loadProgram(day === "sunday" ? "sunday" : "saturday").catch(error => {
  console.error("Απρόσμενο σφάλμα:", error);
  setStatus("Σφάλμα εκκίνησης του προβολέα: " + (error?.message || String(error)), true);
});
</script>
</body>
</html>
